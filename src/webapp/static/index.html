<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axionlab control</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262b35; --fg:#e6e6e6; --mut:#8b93a1; --acc:#4f9cff; --ok:#3fb950; --bad:#f85149; --warn:#d29922; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 2px; }
  input, select { width:100%; padding:7px 9px; background:#0e1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { margin-top:10px; padding:8px 14px; background:var(--acc); color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
  button.sec { background:#2a2f3a; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; }
  .pill { padding:1px 8px; border-radius:20px; font-size:12px; }
  .running{ background:#14304f; color:var(--acc);} .done{ background:#10331c; color:var(--ok);}
  .failed{ background:#3a1416; color:var(--bad);} .stopped{ background:#3a3014; color:var(--warn);}
  #log { background:#0a0c10; border:1px solid var(--line); border-radius:8px; padding:10px; height:340px; overflow:auto; white-space:pre-wrap; font:12px/1.45 ui-monospace,monospace; color:#cdd3dc; }
  .span2 { grid-column:1 / span 2; }
  .mut { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>axionlab &middot; control</header>
<div class="wrap">

  <section class="panel span2">
    <h2>Projects</h2>
    <div class="row">
      <div><label>New project name</label><input id="pj_name" placeholder="e.g. jsc-2l-w4a4"></div>
      <div><label>Description</label><input id="pj_desc" placeholder="optional"></div>
    </div>
    <button onclick="createProject()">Create project</button>
    <table style="margin-top:12px"><thead><tr><th>#</th><th>name</th><th>artifacts</th><th>created</th><th></th></tr></thead><tbody id="projects"></tbody></table>

    <div id="pj_detail" style="display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <h2 style="display:flex;justify-content:space-between;align-items:center">
        <span id="pj_title"></span>
        <button class="sec" style="margin:0;padding:3px 8px" onclick="closeProject()">close</button>
      </h2>
      <p class="mut" id="pj_descline"></p>
      <div id="pj_artifacts"></div>
      <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <h2>Add artifact</h2>
        <div class="row">
          <div><label>Kind</label><select id="ar_kind"></select></div>
          <div><label>Name</label><input id="ar_name" placeholder="e.g. best.pth / cifar10 / Pynq-Z2"></div>
        </div>
        <div class="row">
          <div><label>Path (optional)</label><input id="ar_path" placeholder="outputs/.../best.pth"></div>
          <div><label>Meta JSON (optional)</label><input id="ar_meta" placeholder='{"fpga_part":"xc7z020clg400-1"}'></div>
        </div>
        <button onclick="addArtifact()">Add to project</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Train</h2>
    <label>Experiment</label><select id="tr_exp"></select>
    <div class="row">
      <div><label>Epochs (override)</label><input id="tr_ep" placeholder="default"></div>
      <div><label>Device</label><select id="tr_dev"><option value="">auto</option><option>cuda</option><option>mps</option><option>cpu</option></select></div>
    </div>
    <button onclick="start('train',{exp:v('tr_exp'),epochs:num('tr_ep'),device:v('tr_dev')||null})">Start training</button>
  </section>

  <section class="panel">
    <h2>QAT</h2>
    <label>Experiment</label><select id="qa_exp"></select>
    <div class="row">
      <div><label>Warmup epochs</label><input id="qa_warm" value="0"></div>
      <div><label>Device</label><select id="qa_dev"><option value="">auto</option><option>cuda</option><option>mps</option><option>cpu</option></select></div>
    </div>
    <div class="row">
      <div><label>Schedule</label><input id="qa_sched" value="w8a8:6,w4a4:6"></div>
      <div><label>Min acc (rollback)</label><input id="qa_min" placeholder="none"></div>
    </div>
    <button onclick="start('qat',{exp:v('qa_exp'),warmup_epochs:num('qa_warm')||0,schedule:v('qa_sched'),min_acc:num('qa_min'),device:v('qa_dev')||null})">Start QAT</button>
  </section>

  <section class="panel">
    <h2>Export (QONNX + bundle)</h2>
    <label>Model yaml</label><select id="ex_model"></select>
    <div class="row">
      <div><label>Weights (.pth)</label><input id="ex_w" placeholder="outputs/.../best.pth"></div>
      <div><label>Quantize</label><input id="ex_q" value="w4a4"></div>
    </div>
    <div class="row">
      <div><label>Input shape</label><input id="ex_shape" value="3,32,32"></div>
      <div><label>Input quant bits</label><input id="ex_iq" value="8"></div>
    </div>
    <div class="row">
      <div><label>FPGA part</label><input id="ex_part" value="xck26-sfvc784-2LV-c"></div>
      <div><label>Synth</label><select id="ex_synth"><option>estimate</option><option>ip</option><option>bitfile</option></select></div>
    </div>
    <label>Bundle dir</label><input id="ex_bundle" value="bundle">
    <button onclick="doExport()">Export</button>
  </section>

  <section class="panel">
    <h2>FINN build</h2>
    <label>Bundle dir (cwd)</label><input id="fn_bundle" value="bundle">
    <label>Command</label><input id="fn_cmd" value="./run-docker.sh python build.py">
    <p class="mut">Runs inside the FINN docker image. The bundle must reach run-docker.sh.</p>
    <button onclick="start('finn',{bundle:v('fn_bundle'),command:v('fn_cmd')})">Start FINN build</button>
  </section>

  <section class="panel span2">
    <h2>Jobs</h2>
    <table><thead><tr><th>#</th><th>kind</th><th>status</th><th>command</th><th></th></tr></thead><tbody id="jobs"></tbody></table>
    <h2 style="margin-top:14px">Log <span class="mut" id="logwho"></span></h2>
    <div id="log"></div>
  </section>

  <section class="panel span2">
    <h2>Past runs</h2>
    <table><thead><tr><th>name</th><th>best acc</th><th>epochs</th><th>created</th><th>db</th></tr></thead><tbody id="runs"></tbody></table>
  </section>

</div>
<script>
const v = id => document.getElementById(id).value.trim();
const num = id => { const x = v(id); return x === "" ? null : Number(x); };

async function loadConfig(){
  const c = await (await fetch('/api/config')).json();
  for (const id of ['tr_exp','qa_exp']) fill(id, c.experiments);
  fill('ex_model', c.models);
}
function fill(id, items){ const s=document.getElementById(id); s.innerHTML = items.map(x=>`<option>${x}</option>`).join(''); }

async function start(kind, body){
  const r = await fetch('/api/start/'+kind, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json();
  if (j.id){ watch(j.id); refreshJobs(); }
  else alert('error: '+JSON.stringify(j));
}
function doExport(){
  start('export',{model:v('ex_model'),weights:v('ex_w'),quantize:v('ex_q'),input_shape:v('ex_shape'),
    input_quant:num('ex_iq'),fpga_part:v('ex_part'),out:v('ex_bundle')+'/model.qonnx.onnx',bundle:v('ex_bundle'),synth:v('ex_synth')});
}

let watching=null, offset=0;
function watch(id){ watching=id; offset=0; document.getElementById('log').textContent=''; document.getElementById('logwho').textContent='#'+id; }

async function refreshJobs(){
  const jobs = await (await fetch('/api/jobs')).json();
  document.getElementById('jobs').innerHTML = jobs.map(j=>`
    <tr>
      <td>${j.id}</td><td>${j.kind}</td>
      <td><span class="pill ${j.status}">${j.status}</span></td>
      <td style="max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${j.cmd}">${j.cmd}</td>
      <td>
        <button class="sec" style="margin:0;padding:3px 8px" onclick="watch(${j.id})">log</button>
        ${j.status==='running'?`<button class="sec" style="margin:0;padding:3px 8px" onclick="stopJob(${j.id})">stop</button>`:''}
      </td>
    </tr>`).join('');
}
async function stopJob(id){ await fetch('/api/stop/'+id,{method:'POST'}); refreshJobs(); }

async function pollLog(){
  if(watching!==null){
    const d = await (await fetch(`/api/jobs/${watching}/log?offset=${offset}`)).json();
    if(d.lines && d.lines.length){
      const el=document.getElementById('log');
      el.textContent += d.lines.join('\n')+'\n'; offset=d.next_offset; el.scrollTop=el.scrollHeight;
    }
  }
}
async function refreshRuns(){
  const runs = await (await fetch('/api/runs')).json();
  document.getElementById('runs').innerHTML = runs.map(r=>`
    <tr><td>${r.name}</td><td>${r.best_acc!=null?r.best_acc.toFixed(4):'-'}</td>
    <td>${r.last_epoch!=null?r.last_epoch:'-'}</td><td>${r.created||''}</td><td class="mut">${r.db}</td></tr>`).join('');
}

// ---- projects -------------------------------------------------------------
const KIND_LABELS = {model:'Models', quant_model:'Quantized models',
  training_data:'Training data', hardware_model:'Hardware models'};
let openProject = null;

async function loadKinds(){
  const kinds = await (await fetch('/api/artifact-kinds')).json();
  document.getElementById('ar_kind').innerHTML =
    kinds.map(k=>`<option value="${k}">${KIND_LABELS[k]||k}</option>`).join('');
}
async function refreshProjects(){
  const ps = await (await fetch('/api/projects')).json();
  document.getElementById('projects').innerHTML = ps.map(p=>`
    <tr>
      <td>${p.id}</td>
      <td><a href="#" onclick="showProject(${p.id});return false">${p.name}</a></td>
      <td>${p.artifact_count}</td>
      <td class="mut">${p.created||''}</td>
      <td><button class="sec" style="margin:0;padding:3px 8px" onclick="delProject(${p.id})">delete</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="mut">no projects yet</td></tr>';
}
async function createProject(){
  const name = v('pj_name');
  if(!name){ alert('name required'); return; }
  const r = await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, description:v('pj_desc')})});
  const j = await r.json();
  document.getElementById('pj_name').value=''; document.getElementById('pj_desc').value='';
  refreshProjects(); if(j.id) showProject(j.id);
}
async function delProject(id){
  if(!confirm('delete project #'+id+'?')) return;
  await fetch('/api/projects/'+id,{method:'DELETE'});
  if(openProject===id) closeProject();
  refreshProjects();
}
async function showProject(id){
  openProject = id;
  const p = await (await fetch('/api/projects/'+id)).json();
  document.getElementById('pj_detail').style.display='block';
  document.getElementById('pj_title').textContent = '#'+p.id+' '+p.name;
  document.getElementById('pj_descline').textContent = p.description||'';
  const order = ['model','quant_model','training_data','hardware_model'];
  document.getElementById('pj_artifacts').innerHTML = order.map(k=>{
    const items = (p.artifacts[k]||[]);
    const rows = items.map(a=>`
      <tr><td>${a.name}</td>
      <td class="mut">${a.path||''}</td>
      <td class="mut">${a.meta&&Object.keys(a.meta).length?JSON.stringify(a.meta):''}</td>
      <td><button class="sec" style="margin:0;padding:2px 7px" onclick="delArtifact(${p.id},${a.id})">x</button></td></tr>`
      ).join('') || `<tr><td colspan="4" class="mut">none</td></tr>`;
    return `<h2 style="margin-top:10px">${KIND_LABELS[k]} <span class="mut">(${items.length})</span></h2>
      <table><thead><tr><th>name</th><th>path</th><th>meta</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');
}
function closeProject(){ openProject=null; document.getElementById('pj_detail').style.display='none'; }
async function addArtifact(){
  if(openProject===null){ alert('open a project first'); return; }
  let meta = {};
  const raw = v('ar_meta');
  if(raw){ try{ meta = JSON.parse(raw); }catch(e){ alert('meta is not valid JSON'); return; } }
  const body = {kind:v('ar_kind'), name:v('ar_name'), path:v('ar_path'), meta};
  if(!body.name){ alert('artifact name required'); return; }
  const r = await fetch('/api/projects/'+openProject+'/artifacts',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ alert('error: '+(await r.text())); return; }
  document.getElementById('ar_name').value=''; document.getElementById('ar_path').value=''; document.getElementById('ar_meta').value='';
  showProject(openProject); refreshProjects();
}
async function delArtifact(pid, aid){
  await fetch('/api/projects/'+pid+'/artifacts/'+aid,{method:'DELETE'});
  showProject(pid); refreshProjects();
}

loadConfig(); loadKinds(); refreshJobs(); refreshRuns(); refreshProjects();
setInterval(refreshJobs, 2000);
setInterval(pollLog, 1200);
setInterval(refreshRuns, 5000);
</script>
</body>
</html>
