# JSC-2L: small MLP for jet-substructure classification (16 features -> 5 classes).
# Sequential builder format: [from, repeats, module, name, args].
name: "jsc_2l"
nc: 5

backbone:
  - [-1, 1, Linear, "fc1",   {in_features: 16, out_features: 64}]
  - [-1, 1, ReLU,   "relu1", {inplace: True}]
  - [-1, 1, Linear, "fc2",   {in_features: 64, out_features: 32}]
  - [-1, 1, ReLU,   "relu2", {inplace: True}]
  - [-1, 1, Linear, "fc3",   {in_features: 32, out_features: 5}]
