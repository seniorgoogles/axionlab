# This is a configuration file for the jsc_xl model
name: "jsc_xl"

# Dataset Params
dataset: "jsc"
train_path: None
test_path: None
num_workers: 16
distributed: False
batch_size: [1024,1024] # train, test
dataset_root_path: "jetSubstructure/JSC_Dataset"
bitwidth: 5
msb: 1
lsb: -3
lsb_in: -8
lsb_out: -8




# Training Params
epochs: 80
nc: 5 # number of classes

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Linear, "dense1", {'in_features': 16, 'out_features': 128, 'bias': False}]
  - [-1, 1, ReLU, "relu1", {'inplace': True}]
  - [-1, 1, Linear, "dense2", {'in_features': 128, 'out_features': 64, 'bias': False}]
  - [-1, 1, ReLU, "relu2", {'inplace': True}]
  - [-1, 1, Linear, "dense3", {'in_features': 64, 'out_features': 64, 'bias': False}]
  - [-1, 1, ReLU, "relu3", {'inplace': True}]
  - [-1, 1, Linear, "dense4", {'in_features': 64, 'out_features': 64, 'bias': False}]
  - [-1, 1, ReLU, "relu4", {'inplace': True}]
  - [-1, 1, Linear, "dense5", {'in_features': 64, 'out_features': 5, 'bias': False}]
  - [-1, 1, Softmax, "softmax", {'dim': 1}]