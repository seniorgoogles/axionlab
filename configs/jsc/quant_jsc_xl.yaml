# This is a configuration file for the jsc_xl model
name: "jsc_xl"

# Dataset Params
dataset: "jsc"
train_path: None
test_path: None
num_workers: 16
distributed: False
batch_size: [4196,4196] # train, test
dataset_root_path: "/tmp/datasets/jsc/processed-pythia82-lhc13-all-pt1-50k-r1_h022_e0175_t220_nonu_truth.z"
bitwidth: 5
msb: 1
lsb: -3
lsb_in: -8
lsb_out: -8 # this can be set to type int or list of int and the size of the list must match the number of layers
num_layers: 5

# Training Params
epochs: 80
nc: 5 # number of classes

backbone:
  # [from, repeats, module, args]
  - [-1, 1, QuantLinear, "dense1", {'in_features': 16, 'out_features': 128, 'bias': False, 'weight_bit_width': 16, 'weight_quant': Int8WeightPerTensorFixedPointSparse, 'weight_sparse_eps': 0.0, 'output_quant': Int8ActPerTensorFloat, 'return_quant_tensor': False, 'output_bit_width': 16}]
  - [-1, 1, QuantReLU, "relu1", {'inplace': True}]
  - [-1, 1, QuantLinear, "dense2", {'in_features': 128, 'out_features': 64, 'bias': False, 'weight_bit_width': 16, 'weight_quant': Int8WeightPerTensorFixedPointSparse, 'weight_sparse_eps': 0.0, 'output_quant': Int8ActPerTensorFloat, 'return_quant_tensor': False, 'output_bit_width': 16}]
  - [-1, 1, ReLU, "relu2", {'inplace': True}]
  - [-1, 1, QuantLinear, "dense3", {'in_features': 64, 'out_features': 64, 'bias': False, 'weight_bit_width': 16, 'weight_quant': Int8WeightPerTensorFixedPointSparse, 'weight_sparse_eps': 0.0, 'output_quant': Int8ActPerTensorFloat, 'return_quant_tensor': False, 'output_bit_width': 16}]
  - [-1, 1, ReLU, "relu3", {'inplace': True}]
  - [-1, 1, QuantLinear, "dense4", {'in_features': 64, 'out_features': 64, 'bias': False, 'weight_bit_width': 16, 'weight_quant': Int8WeightPerTensorFixedPointSparse, 'weight_sparse_eps': 0.0, 'output_quant': Int8ActPerTensorFloat, 'return_quant_tensor': False, 'output_bit_width': 16}]
  - [-1, 1, ReLU, "relu4", {'inplace': True}]
  - [-1, 1, QuantLinear, "dense5", {'in_features': 64, 'out_features': 5, 'bias': False, 'weight_bit_width': 16, 'weight_quant': Int8WeightPerTensorFixedPointSparse, 'weight_sparse_eps': 0.0, 'output_quant': Int8ActPerTensorFloat, 'return_quant_tensor': False, 'output_bit_width': 16}]
  - [-1, 1, Softmax, "softmax", {'dim': 1}]