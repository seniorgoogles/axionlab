# This is a configuration file for the jsc_lite model
name: "jsc_lite"

# Dataset Params
dataset: "jsc"
train_path: None
test_path: None
num_workers: 16
distributed: False
batch_size: [1024,1024] # train, test
dataset_root_path: "jetSubstructure/JSC_Dataset"
bitwidth: 3
msb: 1
lsb: -1
lsb_in: -8
lsb_out: -8
num_layers: 3

# Training Params
epochs: 80
nc: 10 # number of classes


backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Linear, "dense1", { 'in_features': 16, 'out_features': 64, 'bias': False } ]
  - [ -1, 1, ReLU, "relu1", { 'inplace': True } ]
  - [ -1, 1, Linear, "dense2", { 'in_features': 64, 'out_features': 32, 'bias': False } ]
  - [ -1, 1, ReLU, "relu2", { 'inplace': True } ]
  - [ -1, 1, Linear, "dense3", { 'in_features': 32, 'out_features': 5, 'bias': False } ]
  - [ -1, 1, Softmax, "softmax", { 'dim': 1 } ]