# YOLOv8n with DEDICATED quant blocks (QuantConv / QuantC2f / QuantSPPF).
# Unlike `quant: {...}` swap-surgery, these blocks carry shared-scale quantizers
# at every cat/add boundary (FINN-export friendly). Set bit widths per layer via
# weight_bit_width / act_bit_width in args.
name: "yolov8n_quant"
nc: 80
ch: 3

scales: {depth: 0.33, width: 0.25, max_channels: 1024}

backbone:
  - [-1, 1, Conv,       {c2: 64, k: 3, s: 2}]                                          # 0  first layer float (common)
  - [-1, 1, QuantConv,  {c2: 128, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}]  # 1
  - [-1, 3, QuantC2f,   {c2: 128, shortcut: True, weight_bit_width: 4, act_bit_width: 4}]  # 2
  - [-1, 1, QuantConv,  {c2: 256, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}]  # 3
  - [-1, 6, QuantC2f,   {c2: 256, shortcut: True, weight_bit_width: 4, act_bit_width: 4}]  # 4
  - [-1, 1, QuantConv,  {c2: 512, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}]  # 5
  - [-1, 6, QuantC2f,   {c2: 512, shortcut: True, weight_bit_width: 4, act_bit_width: 4}]  # 6
  - [-1, 1, QuantConv,  {c2: 1024, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}] # 7
  - [-1, 3, QuantC2f,   {c2: 1024, shortcut: True, weight_bit_width: 4, act_bit_width: 4}] # 8
  - [-1, 1, QuantSPPF,  {c2: 1024, k: 5, weight_bit_width: 4, act_bit_width: 4}]        # 9

head:
  - [-1, 1, nn.Upsample, {scale_factor: 2, mode: nearest}]                              # 10
  - [[-1, 6], 1, Concat, {dim: 1}]                                                      # 11
  - [-1, 3, QuantC2f, {c2: 512, weight_bit_width: 4, act_bit_width: 4}]                 # 12

  - [-1, 1, nn.Upsample, {scale_factor: 2, mode: nearest}]                              # 13
  - [[-1, 4], 1, Concat, {dim: 1}]                                                      # 14
  - [-1, 3, QuantC2f, {c2: 256, weight_bit_width: 4, act_bit_width: 4}]                 # 15  (P3/8)

  - [-1, 1, QuantConv, {c2: 256, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}]    # 16
  - [[-1, 12], 1, Concat, {dim: 1}]                                                     # 17
  - [-1, 3, QuantC2f, {c2: 512, weight_bit_width: 4, act_bit_width: 4}]                 # 18  (P4/16)

  - [-1, 1, QuantConv, {c2: 512, k: 3, s: 2, weight_bit_width: 4, act_bit_width: 4}]    # 19
  - [[-1, 9], 1, Concat, {dim: 1}]                                                      # 20
  - [-1, 3, QuantC2f, {c2: 1024, weight_bit_width: 4, act_bit_width: 4}]                # 21  (P5/32)

  - [[15, 18, 21], 1, Detect, {}]                                                       # 22  Detect float (host)
