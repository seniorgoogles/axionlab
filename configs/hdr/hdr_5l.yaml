# This is a configuration file for the jsc_2l model
name: "hdr-5l"

# Dataset Params
dataset: "MNIST"
train_path: None
test_path: None
num_workers: 16
distributed: False
batch_size: [128,5120] # train, test

# Training Params
epochs: 80
nc: 10 # number of classes


backbone:
  # [from, repeats, module, args]
- [ -1, 1, Linear, "dense1", { 'in_features': 784, 'out_features': 256, 'bias': True } ]
- [ -1, 1, ReLU, "relu1", { 'inplace': True } ]
- [ -1, 1, Linear, "dense2", { 'in_features': 256, 'out_features': 100, 'bias': True } ]
- [ -1, 1, ReLU, "relu2", { 'inplace': True } ]
- [ -1, 1, Linear, "dense3", { 'in_features': 100, 'out_features': 100, 'bias': True } ]
- [ -1, 1, ReLU, "relu3", { 'inplace': True } ]
- [ -1, 1, Linear, "dense4", { 'in_features': 100, 'out_features': 100, 'bias': True } ]
- [ -1, 1, ReLU, "relu4", { 'inplace': True } ]
- [ -1, 1, Linear, "dense5", { 'in_features': 100, 'out_features': 10, 'bias': True } ]
- [ -1, 1, Softmax, "softmax", { 'dim': 1 } ]