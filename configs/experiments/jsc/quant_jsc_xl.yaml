# Quantization experiment for JSC-XL model
# Inherits from base training config and adds quantization

base: ./train_jsc_xl.yaml

# Override training params for QAT
epochs: 50
learning_rate: 0.0001

# Quantization configuration
quantization:
  enabled: true
  weight_bit_width: 8
  act_bit_width: 8
  bias_bit_width: 32

# Load pretrained weights before QAT
weights_path: "./outputs/jsc_xl_train/best_weights.pth"

# Output directory
output_dir: "./outputs/jsc_xl_quant"
