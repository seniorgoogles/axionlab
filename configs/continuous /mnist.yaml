# This is a configuration file for the ResNet-18 model
name: "continousflow_mnist"

# Dataset Params
dataset: "mnist"
train_path: None
test_path: None
num_workers: 16
distributed: False
batch_size: [128,5120] # train, test

# Training Params
epochs: 80
nc: 10 # number of classes

backbone:
  # [from, repeats, module, args]
  # Depthwise
  - [-1, 1, Conv2d, "depthwise1", {'in_channels': 1, 'out_channels': 1, 'kernel_size': 3, 'stride': 2, 'padding': 0, 'groups': 1, 'bias': False}]
  - [ -1, 1, ReLU, "relu1", { 'inplace': True } ]
  # Pointwise
  - [-1, 1, Conv2d, "pointwise1", {'in_channels': 1, 'out_channels': 4, 'kernel_size': 1, 'stride': 1, 'padding': 0, 'bias': False}]
  - [ -1, 1, ReLU, "relu2", { 'inplace': True } ]

  # Depthwise
  - [-1, 1, Conv2d, "depthwise2", {'in_channels': 4, 'out_channels': 4, 'kernel_size': 3, 'stride': 1, 'padding': 0, 'groups': 4, 'bias':False}]
  - [ -1, 1, ReLU, "relu3", { 'inplace': True } ]
  # Pointwise
  - [-1, 1, Conv2d, "pointwise2", {'in_channels': 4, 'out_channels': 16, 'kernel_size': 1, 'stride': 1, 'padding': 0, 'bias': False}]
  - [ -1, 1, ReLU, "relu4", { 'inplace': True } ]

  # Depthwise
  - [-1, 1, Conv2d, "depthwise3", {'in_channels': 16, 'out_channels': 16, 'kernel_size': 3, 'stride': 2, 'padding': 0, 'bias': False}]
  - [ -1, 1, ReLU, "relu5", { 'inplace': True } ]
  # Pointwise
  - [-1, 1, Conv2d, "pointwise3", {'in_channels': 16, 'out_channels': 64, 'kernel_size': 1, 'stride': 1, 'padding': 0, 'bias': False}]
  - [ -1, 1, ReLU, "relu6", { 'inplace': True } ]

  - [-1, 1, Flatten, "flatten", {}]
  - [-1, 1, Linear, "dense", {'in_features': 256, 'out_features': 10, 'bias': False}]
  - [-1, 1, Softmax, "softmax", {'dim':1}]

